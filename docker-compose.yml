services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: library_db
      MYSQL_ROOT_PASSWORD: localrootpassword
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocalrootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/library_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: localrootpassword
      JWT_SECRET: local-compose-secret-change-this-to-a-long-random-string
      FRONTEND_ORIGIN: http://localhost:5173
    ports: ["8080:8080"]
    depends_on:
      mysql: { condition: service_healthy }
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  mysql_data:

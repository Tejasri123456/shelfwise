spring.application.name=library-management
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Tejasri@23}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-to-a-long-random-secret-please}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173,https://*.vercel.app,http://localhost:3000,http://localhost:8080}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
springdoc.swagger-ui.path=/swagger-ui.html
logging.level.root=INFO
